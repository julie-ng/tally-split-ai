# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Tally Split AI Evals — analyze-annotations (handwritten mark detection)'

providers:
  - id: file://providers/analyze-annotations-provider.mjs
    label: analyze-annotations

# Custom provider builds the real request itself (via analyzeAnnotations()),
# so this prompt's text is unused — promptfoo just needs one to iterate over.
prompts:
  - 'unused'

tests:
  - file://tests/annotations/vfpmdwas.yaml
  - file://tests/annotations/2d8lmqch.yaml
  - file://tests/annotations/x4kb2vqb.yaml
  # pggm4knx: excluded — ambiguous handwriting ("MJ?" vs "MR?") has no verifiable
  # ground truth for strict match. Belongs in a future fuzzy-match/low-confidence
  # tier testing graceful degradation, not this strict-match suite.
  # - file://tests/annotations/pggm4knx.yaml
  - file://tests/annotations/qngwubea.yaml
  - file://tests/annotations/zyfnpw5n.yaml
  - file://tests/annotations/p4f2uvta.yaml
